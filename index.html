<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MyShop</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <!-- Navbar -->

    <header>

        <div class="logo">

            MyShop

        </div>

        <nav>

            <a href="index.html">

                Home

            </a>

            <a href="cart.html">

                Cart

            </a>

            <a href="wishlist.html">

                Wishlist

            </a>

            <a href="checkout.html">

                Checkout

            </a>

        </nav>

    </header>


    <!-- Hero Banner -->

    <section class="hero-banner">

        <div class="hero-overlay">

            <h1>

                Welcome To MyShop

            </h1>

            <p>

                Discover Amazing Products At Best Prices

            </p>

            <button>

                Shop Now

            </button>

        </div>

    </section>


    <!-- Products -->

    <section class="products">

        <h2>

            Featured Products

        </h2>


        <!-- Search + Filter -->

        <div class="controls">

            <input type="text"
                   id="searchInput"
                   placeholder="Search Products">


            <select id="categoryFilter">

                <option value="All">

                    All Categories

                </option>

                <option value="Electronics">

                    Electronics

                </option>

                <option value="Fashion">

                    Fashion

                </option>

                <option value="Accessories">

                    Accessories

                </option>

            </select>

        </div>


        <!-- Products Container -->

        <div class="products-container"
             id="productsContainer">

        </div>

    </section>


    <!-- Toast -->

    <div id="toast">

    </div>


    <!-- Product Modal -->

    <div class="modal"
         id="productModal">

        <div class="modal-content">

            <span id="closeModal">

                &times;

            </span>

            <img id="modalImage">

            <h2 id="modalTitle">

            </h2>

            <p id="modalPrice">

            </p>

        </div>

    </div>


    <!-- Footer -->

    <footer>

        <p>

            © 2026 MyShop | All Rights Reserved

        </p>

    </footer>


    <script src="products.js"></script>

    <script src="script.js"></script>

</body>

</html>
