<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navbar -->
    <header>
        <div class="logo">
            MyShop
        </div>
        <nav>
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">Cart</a>
            <a href="#">Contact</a>
        </nav>
    </header>


    <!-- Homepage Section -->

    <section class="hero">

        <h1>Welcome to My E-Commerce Store</h1>
        <p>
            Buy the best products at affordable prices.
        </p>
        <button>
            Shop Now
        </button>
<!-- Products Section -->

<section class="products">

    <h2>Featured Products</h2>

    <div class="products-container">

        <!-- Product 1 -->

        <div class="product-card">

            <img src="https://via.placeholder.com/250" alt="Laptop">

            <h3>Laptop</h3>

            <p>₹50,000</p>

            <button>Add to Cart</button>

        </div>


        <!-- Product 2 -->

        <div class="product-card">

            <img src="https://via.placeholder.com/250" alt="Shoes">

            <h3>Shoes</h3>

            <p>₹2,000</p>

            <button>Add to Cart</button>

        </div>


        <!-- Product 3 -->

        <div class="product-card">

            <img src="https://via.placeholder.com/250" alt="Phone">

            <h3>Phone</h3>

            <p>₹25,000</p>

            <button>Add to Cart</button>

        </div>


        <!-- Product 4 -->

        <div class="product-card">

            <img src="https://via.placeholder.com/250" alt="Watch">

            <h3>Watch</h3>

            <p>₹3,500</p>

            <button>Add to Cart</button>

        </div>

    </div>


    </section>


    <!-- Footer -->

    <footer>

        <p>
            © 2026 MyShop | All Rights Reserved
        </p>

    </footer>

    <script src="script.js"></script>

</body>

</html>
