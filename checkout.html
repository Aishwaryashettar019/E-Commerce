<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Checkout</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Navbar -->

    <header>

        <div class="logo">

            MyShop

        </div>

        <nav>

            <a href="index.html">

                Home

            </a>

            <a href="cart.html">

                Cart

            </a>

            <a href="wishlist.html">

                Wishlist

            </a>

        </nav>

    </header>


    <!-- Checkout Section -->

    <section class="checkout-section">

        <div class="checkout-box">

            <h1>

                Checkout 🛍️

            </h1>

            <p>

                Complete your order details below

            </p>


            <form class="checkout-form">

                <input type="text"
                       placeholder="Full Name"
                       required>


                <input type="email"
                       placeholder="Email Address"
                       required>


                <input type="tel"
                       placeholder="Phone Number"
                       required>


                <textarea placeholder="Delivery Address"
                          rows="5"
                          required></textarea>


                <select required>

                    <option>

                        Select Payment Method

                    </option>

                    <option>

                        Cash On Delivery

                    </option>

                    <option>

                        UPI

                    </option>

                    <option>

                        Credit Card

                    </option>

                    <option>

                        Debit Card

                    </option>

                </select>


                <button type="submit">

                    Place Order

                </button>

            </form>

        </div>

    </section>


    <!-- Footer -->

    <footer>

        <p>

            © 2026 MyShop | All Rights Reserved

        </p>

    </footer>

</body>

</html>
