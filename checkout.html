<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Checkout</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Navbar -->

    <header>

        <div class="logo">

            MyShop

        </div>

        <nav>

            <a href="index.html">Home</a>
            <a href="cart.html">Cart</a>

        </nav>

    </header>


    <!-- Checkout Section -->

    <section class="checkout-section">

        <h2>Checkout</h2>

        <form class="checkout-form">

            <input type="text"
                   placeholder="Full Name"
                   required>

            <input type="email"
                   placeholder="Email Address"
                   required>

            <input type="text"
                   placeholder="Address"
                   required>

            <input type="text"
                   placeholder="City"
                   required>

            <button type="submit">

                Place Order

            </button>

        </form>

    </section>


    <!-- Footer -->

    <footer>

        <p>
            © 2026 MyShop | All Rights Reserved
        </p>

    </footer>

</body>

</html>
